name: Trabalho
description: Propor uma funcionalidade nova ou uma melhoria em algo que já existe.
title: "[trabalho] "
labels:
  - type:feature
body:
  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: Situação atual e qual necessidade do usuário isto atende.
    validations:
      required: true
  - type: textarea
    id: entrega
    attributes:
      label: O que entrega
      description: Quem usa e o que passa a conseguir fazer, em uma frase.
      placeholder: "Como <perfil>, consigo <ação> para <resultado>."
    validations:
      required: true
  - type: textarea
    id: criterios
    attributes:
      label: Critérios de aceite
      description: Condições verificáveis que precisam ser verdadeiras para concluir.
    validations:
      required: true
  - type: textarea
    id: notas
    attributes:
      label: Notas
      description: Opcional. Requisitos, áreas ou arquivos tocados, relações entre tickets (Parte de #, Bloqueado por #) e qualquer risco relevante (auth, dados pessoais, produção).
