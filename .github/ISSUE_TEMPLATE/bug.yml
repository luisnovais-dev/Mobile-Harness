name: Defeito
description: Relatar um comportamento que difere do esperado.
title: "[bug] "
labels:
  - type:bug
body:
  - type: textarea
    id: contexto
    attributes:
      label: Contexto
      description: O que acontece, quem é afetado e onde foi observado.
    validations:
      required: true
  - type: textarea
    id: reproducao
    attributes:
      label: Passos para reproduzir
      description: Passos numerados que reproduzem o comportamento.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: esperado_observado
    attributes:
      label: Esperado vs. observado
      description: O que deveria acontecer e o que acontece hoje (inclua erros, sem segredos nem dados pessoais).
    validations:
      required: true
  - type: textarea
    id: notas
    attributes:
      label: Notas
      description: Opcional. Critérios de aceite da correção, áreas afetadas ou qualquer contexto extra.
