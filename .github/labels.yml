# Conjunto mínimo de labels. Fonte única dos nomes, cores e descrições.
# Filosofia: só a label de TIPO é obrigatória. status:ready sinaliza o que está pronto pra dev.
# Chaves em inglês (identificadores); descrições em pt-BR.

labels:
  - name: "type:feature"
    color: "a2eeef"
    description: "Funcionalidade nova"
  - name: "type:bug"
    color: "d73a4a"
    description: "Correção de comportamento incorreto"
  - name: "type:docs"
    color: "0075ca"
    description: "Mudança somente de documentação"
  - name: "type:chore"
    color: "ededed"
    description: "Manutenção sem mudança de comportamento"
  - name: "type:epic"
    color: "5319e7"
    description: "Agrupamento de entregas que formam uma capacidade"
  - name: "type:enhancement"
    color: "84b6eb"
    description: "Melhoria de funcionalidade existente"
  - name: "status:ready"
    color: "0e8a16"
    description: "Pronto pra dev"

# Normalização: labels em uso que não estão acima são remarcados antes de serem removidos.
# Remarcar: aplicar o label de destino em cada item e só então remover o de origem.
# Nenhum label em uso é removido antes da remarcação.
remarcar:
  bug: type:bug
  documentation: type:docs
  enhancement: type:enhancement
  status:approved: status:ready

repository:
  delete_branch_on_merge: true
